<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#241813" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kitchen Rider" />
    <title>Rider | THE KITCHEN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="rider.css?v=20261125-1" />
  </head>
  <body>
    <header class="rd-top">
      <div class="rd-brand">
        <span class="rd-logo">K</span>
        <div>
          <strong>Kitchen Rider</strong>
          <small id="rd-name">Loading…</small>
        </div>
      </div>
      <button type="button" class="rd-logout" id="rd-logout">Log out</button>
    </header>

    <main class="rd-main">
      <section class="rd-online" id="rd-online-card">
        <div>
          <p class="rd-online-label" id="rd-online-label">You are offline</p>
          <p class="rd-online-help" id="rd-online-help">Go online to share your location with students while you deliver.</p>
        </div>
        <label class="rd-switch">
          <input type="checkbox" id="rd-online" />
          <span aria-hidden="true"></span>
          <span class="rd-sr">Online</span>
        </label>
      </section>

      <section class="rd-stats" aria-label="Today">
        <div><strong id="rd-stat-active">0</strong><span>Active</span></div>
        <div><strong id="rd-stat-done">0</strong><span>Delivered (24h)</span></div>
        <div><strong id="rd-stat-fees">$0</strong><span>Delivery fees</span></div>
      </section>

      <nav class="rd-tabs" role="tablist">
        <button type="button" role="tab" class="rd-tab is-active" data-tab="mine" aria-selected="true">My deliveries <b id="rd-count-mine">0</b></button>
        <button type="button" role="tab" class="rd-tab" data-tab="available" aria-selected="false">New orders <b id="rd-count-available">0</b></button>
      </nav>

      <p class="rd-message" id="rd-message" role="status" aria-live="polite"></p>
      <div class="rd-list" id="rd-list" aria-live="polite"></div>
    </main>

    <dialog class="rd-dialog" id="rd-code-dialog" aria-labelledby="rd-code-title">
      <form method="dialog" id="rd-code-form">
        <h2 id="rd-code-title">Enter the delivery code</h2>
        <p>Ask the student for the 4-digit code shown in their order. This confirms they received the food.</p>
        <label class="rd-code-field">
          <span class="visually-hidden">4-digit delivery code</span>
          <input id="rd-code-input" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" placeholder="0000" aria-label="4-digit delivery code" />
        </label>
        <p class="rd-code-error" id="rd-code-error" role="alert"></p>
        <div class="rd-dialog-actions">
          <button type="button" class="rd-btn rd-btn--ghost" id="rd-code-cancel">Cancel</button>
          <button type="submit" class="rd-btn rd-btn--green" id="rd-code-submit">Confirm delivery</button>
        </div>
      </form>
    </dialog>

    <script src="rider.js?v=20261125-1"></script>
  </body>
</html>
