<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | THE KITCHEN</title>
    <link rel="stylesheet" href="styles.css?v=password-reset-1" />
  </head>
  <body class="auth-body">
    <header class="topbar">
      <div class="container nav">
        <div class="brand">
          <span class="brand-mark">F</span>
          <div>
            <h1>THE KITCHEN</h1>
            <p>User access</p>
          </div>
        </div>
        <nav>
          <a href="/home.html">Home</a>
          <a href="/restaurant.html">Restaurant</a>
          <a href="/delivery.html">Delivery</a>
        </nav>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-header">
          <p class="eyebrow">Secure access</p>
          <h2>Login</h2>
        </div>

        <form id="login-form" class="auth-form" method="post" action="/api/auth/login">
          <div class="field-group">
            <label for="loginUsername">Username</label>
            <input id="loginUsername" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Enter username" required />
          </div>
          <div class="field-group">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required />
          </div>
          <button type="submit" class="submit-btn">Login</button>
        </form>

        <p class="auth-link-row">
          <a href="/reset-password.html">Forgot password?</a>
        </p>
        <p class="auth-link-row">
          Don’t have an account?
          <a href="/register.html">Create one</a>
        </p>
      </div>
    </main>

    <div id="toast" class="toast"></div>
    <script src="auth.js?v=password-reset-1"></script>
    <script src="staff-dashboard-links.js?v=20261026-1"></script>
  </body>
</html>
