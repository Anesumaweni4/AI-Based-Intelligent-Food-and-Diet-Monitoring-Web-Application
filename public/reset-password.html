<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Password Reset | THE KITCHEN</title>
    <link rel="stylesheet" href="styles.css?v=whatsapp-reset-2" />
  </head>
  <body class="auth-body">
    <header class="topbar">
      <div class="container nav">
        <div class="brand">
          <span class="brand-mark">F</span>
          <div>
            <h1>THE KITCHEN</h1>
            <p>Password recovery</p>
          </div>
        </div>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-header">
          <p class="eyebrow">Account recovery</p>
          <h2>Reset Password</h2>
        </div>

        <form id="password-reset-request-form" class="auth-form">
          <div class="field-group">
            <label for="reset-email">Account email address</label>
            <input id="reset-email" type="email" autocomplete="email" maxlength="255" required />
          </div>
          <div class="field-group">
            <label for="reset-delivery">Send reset link by</label>
            <select id="reset-delivery" name="delivery">
              <option value="email">Email</option>
              <option value="whatsapp">WhatsApp (confirmed number required)</option>
            </select>
          </div>
          <p class="schedule-help">WhatsApp recovery is only sent to a number confirmed by an administrator. If WhatsApp is not configured yet, choose Email.</p>
          <button id="reset-request-submit" type="submit" class="submit-btn">Email me a reset link</button>
          <p id="password-reset-request-status" class="schedule-status" role="status" aria-live="polite"></p>
        </form>

        <form id="password-reset-complete-form" class="auth-form" hidden>
          <div class="field-group">
            <label for="reset-new-password">New password</label>
            <input id="reset-new-password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required />
          </div>
          <div class="field-group">
            <label for="reset-confirm-password">Confirm new password</label>
            <input id="reset-confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required />
          </div>
          <button type="submit" class="submit-btn">Set new password</button>
          <p id="password-reset-complete-status" class="schedule-status" role="status" aria-live="polite"></p>
        </form>

        <p class="auth-link-row"><a href="login.html">Back to login</a></p>
      </div>
    </main>
    <script src="auth.js?v=whatsapp-reset-2"></script>
  </body>
</html>
