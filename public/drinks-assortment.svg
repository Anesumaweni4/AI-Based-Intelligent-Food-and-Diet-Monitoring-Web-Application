      <path d="M43 189c56-31 117-31 173 0v83c-58-31-116-31-173 0Z" fill="#fff7e9"/>
      <text x="129" y="229" text-anchor="middle" fill="#c61d32" font-family="Arial,sans-serif" font-size="28" font-weight="700">COKE</text>
    </g>
  </g>
