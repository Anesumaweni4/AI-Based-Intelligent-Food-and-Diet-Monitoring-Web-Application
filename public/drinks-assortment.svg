<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
  <title id="title">A selection of cold drinks</title>
  <desc id="description">An orange juice carton, a blue soda can, and a red soda bottle on a sunny counter.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9d783"/>
      <stop offset="1" stop-color="#edaa47"/>
    </linearGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#ef790d"/>
    </linearGradient>
    <linearGradient id="blueCan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07519c"/>
      <stop offset="0.5" stop-color="#1787d2"/>
      <stop offset="1" stop-color="#064487"/>
    </linearGradient>
    <linearGradient id="redBottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a90920"/>
      <stop offset="0.5" stop-color="#ed3344"/>
      <stop offset="1" stop-color="#9e1024"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="560" fill="url(#background)"/>
  <circle cx="120" cy="72" r="150" fill="#fff4cd" opacity=".25"/>
  <circle cx="800" cy="80" r="190" fill="#fff0b1" opacity=".25"/>
  <path d="M0 405 Q215 360 448 411 T900 392 V560 H0Z" fill="#f6cf89"/>
  <ellipse cx="460" cy="475" rx="365" ry="34" fill="#9d5b29" opacity=".17"/>
  <g filter="url(#shadow)">
    <g transform="translate(130 133)">
      <path d="M24 68 103 16h154l40 52v255H24Z" fill="url(#juice)"/>
      <path d="m103 16 28 52H24Z" fill="#ffdf70"/>
      <path d="M131 68h166v18H131Z" fill="#df690f" opacity=".55"/>
      <path d="M62 167c35-52 95-49 124-9-37 46-85 58-124 9Z" fill="#fff2bc"/>
      <path d="M119 158c28-30 61-29 80-7-22 30-51 36-80 7Z" fill="#ff9b21"/>
      <circle cx="111" cy="158" r="39" fill="none" stroke="#fff8da" stroke-width="8"/>
      <text x="173" y="268" text-anchor="middle" fill="#fffdf4" font-family="Arial,sans-serif" font-size="25" font-weight="700">MINUTE</text>
      <text x="173" y="295" text-anchor="middle" fill="#fffdf4" font-family="Arial,sans-serif" font-size="25" font-weight="700">MAID</text>
    </g>
    <g transform="translate(382 108)">
      <ellipse cx="112" cy="36" rx="83" ry="18" fill="#cbd9e5"/>
      <rect x="29" y="35" width="166" height="316" rx="34" fill="url(#blueCan)"/>
      <ellipse cx="112" cy="38" rx="80" ry="14" fill="#e8f1f7"/>
      <path d="M34 90h156M34 296h156" stroke="#68b8ee" stroke-width="6" opacity=".48"/>
      <circle cx="112" cy="193" r="58" fill="#f7f5ee"/>
      <path d="M73 180c20-30 47-39 79-24-20 4-38 17-51 34 16 11 37 14 59 8-22 22-57 29-87 8-12-8-18-17-20-26 7 2 13 2 20 0Z" fill="#df3346"/>
      <text x="112" y="264" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">PEPSI</text>
    </g>
