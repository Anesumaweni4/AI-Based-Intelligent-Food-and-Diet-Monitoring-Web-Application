services:
  - type: web
    name: food-ordering-app
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FITBIT_TOKEN_ENCRYPTION_KEY
        generateValue: true
      # Password reset emails (fill these in on Render; never commit real values)
      - key: APP_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # AI meal photo scanner (Claude). Add your key on Render; never commit it.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Delivery: kitchen location for the tracking map (optional) and fee in dollars
      - key: KITCHEN_LAT
        sync: false
      - key: KITCHEN_LNG
        sync: false
      - key: DELIVERY_FEE
        value: "3.50"
